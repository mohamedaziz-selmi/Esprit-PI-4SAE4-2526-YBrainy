# ╔══════════════════════════════════════════════════════════════════╗
# ║  YBrainy — Full Platform Docker Compose                         ║
# ║  Run:    docker-compose up --build                              ║
# ║  NOTE:   Stop all PowerShell services first (port conflicts)    ║
# ║                                                                  ║
# ║  Gateway:  http://localhost:8088                                ║
# ║  Eureka:   http://localhost:8761                                ║
# ║  RabbitMQ: http://localhost:15672  (guest/guest)                ║
# ║  Swagger:  http://localhost:8088/swagger-ui.html                ║
# ╚══════════════════════════════════════════════════════════════════╝

networks:
  ybrainy-net:
    driver: bridge

volumes:
  mysql-data:
  postgres-data:
  mongodb-data:
  rabbitmq-data:
  course-uploads:
  lesson-uploads:
  user-uploads:
  thread-uploads:
  post-uploads:
  messaging-uploads:

services:

  # ══════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ══════════════════════════════════════════════════════════════════

  mysql:
    image: mysql:8.0
    container_name: ybrainy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ybrainy-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:15-alpine
    container_name: ybrainy-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ""
      POSTGRES_DB: ybrainy_notes
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ybrainy-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:6
    container_name: ybrainy-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - ybrainy-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ybrainy-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ybrainy-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  zipkin:
    image: openzipkin/zipkin:3
    container_name: ybrainy-zipkin
    ports:
      - "9411:9411"
    networks:
      - ybrainy-net

  # ══════════════════════════════════════════════════════════════════
  # SERVICE REGISTRY & CONFIG
  # ══════════════════════════════════════════════════════════════════

  eureka:
    build:
      context: ./user/p-r-k/Eureka/Eureka
      dockerfile: Dockerfile
    container_name: ybrainy-eureka
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: "8761"
    networks:
      - ybrainy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  config-server:
    build:
      context: ./YBRAINY/ConfigServer/config-server
      dockerfile: Dockerfile
    container_name: ybrainy-config-server
    ports:
      - "8888:8888"
    environment:
      SERVER_PORT: "8888"
      YBRAINY_EUREKA_URL: http://eureka:8761/eureka/
      ZIPKIN_URL: http://zipkin:9411
      # Secrets for configs served by this server
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      TTS_API_KEY: ${TTS_API_KEY}
      CONTENT_WRITER_API_KEY: ${CONTENT_WRITER_API_KEY}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      EVENT_GROQ_API_KEY: ${EVENT_GROQ_API_KEY}
      HF_TOKEN: ${HF_TOKEN}
      GITHUB_MODELS_API_KEY: ${GITHUB_MODELS_API_KEY}
    depends_on:
      eureka:
        condition: service_healthy
    networks:
      - ybrainy-net

  # ══════════════════════════════════════════════════════════════════
  # USER SERVICE
  # ══════════════════════════════════════════════════════════════════

  user-service:
    build:
      context: ./user
      dockerfile: Dockerfile
    container_name: ybrainy-user-service
    ports:
      - "8899:8899"
    environment:
      SERVER_PORT: "8899"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ybrainy_users?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      YBRAINY_EUREKA_URL: http://eureka:8761/eureka/
      ZIPKIN_URL: http://zipkin:9411
      CONFIG_SERVER_URL: http://config-server:8888
      KEYCLOAK_BASE_URL: http://host.docker.internal:9190
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://host.docker.internal:9190/realms/microservices
      APP_UPLOAD_IMAGES_DIR: /app/uploads/images
      APP_UPLOAD_IMAGES_PUBLIC_BASE_URL: http://localhost:8899/images
    volumes:
      - user-uploads:/app/uploads/images
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_healthy
      config-server:
        condition: service_started
    networks:
      - ybrainy-net

  # ══════════════════════════════════════════════════════════════════
  # YBRAINY CORE — Course / Quiz / Lesson / Enrollment
  # ══════════════════════════════════════════════════════════════════


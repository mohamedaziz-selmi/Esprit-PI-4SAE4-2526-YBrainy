<!-- Career CTA Section -->
<div class="comm-section">
  <div class="container container-md">
    <div class="career-box">
      <div class="career-img">
        <div class="career-circle circle-binary">
          <video autoplay muted loop playsinline>
            <source [src]="assets + 'wp-content/themes/ciklum/assets/video/neon-glow.mp4'">
          </video>
          <div class="circle-binary-overlay">
            <div class="hover-parent mix">
              <canvas class="binary-canvas"></canvas>
            </div>
          </div>
        </div>
        <img [src]="assets + 'wp-content/uploads/2025/10/career-img.webp'" alt="" width="807" height="530">
      </div>
      <div class="career-txt">
        <h3 class="small-head-tag">Your Future Starts Here</h3>
        <h2 class="comm-head white">Start Your Learning Journey</h2>
        <div class="comm-txt white mb30">
          <p>Join thousands of learners who are transforming their careers with expert-led courses and
            industry-recognized certifications.</p>
        </div>
        <a routerLink="/courses" class="button">Browse Courses</a>
      </div>
    </div>
  </div>
</div>

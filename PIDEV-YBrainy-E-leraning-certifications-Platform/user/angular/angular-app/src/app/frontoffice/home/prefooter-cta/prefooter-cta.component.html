<!-- PreFooter CTA Section -->
<div class="comm-section pfHome pb0">
  <div class="container">
    <div class="pre-footer-wrap">
      <div class="pf-circle circle-binary">
        <div class="ring"></div>
        <video autoplay muted loop playsinline>
          <source [src]="assets + 'wp-content/uploads/2025/10/neon-glow.mp4'" type="video/mp4">
        </video>
        <div class="circle-overlay"></div>
        <div class="circle-binary-overlay">
          <div class="hover-parent mix">
            <canvas class="binary-canvas"></canvas>
          </div>
        </div>
      </div>

      <div class="comm-head-wrap cen">
        <div class="comm-head-left">
          <h2 class="comm-head mb24">Ready to Level Up Your Career?<br />Start Learning Today</h2>
          <div class="comm-txt mb36">
            <p>Whether you're a beginner exploring new skills or a professional seeking certifications, we have the
              perfect course for you.</p>
          </div>
        </div>
        <a routerLink="/courses" class="button center">Explore Courses</a>
      </div>
    </div>
  </div>
</div>

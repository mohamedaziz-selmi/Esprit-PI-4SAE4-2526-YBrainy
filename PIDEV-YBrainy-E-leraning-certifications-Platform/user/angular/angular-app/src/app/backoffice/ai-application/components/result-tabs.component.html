<section class="tabs-card fade-slide-up">
  <div class="tabs-card__tabs">
    <button
      type="button"
      [class.is-active]="activeTab === 'optimizedCV'"
      (click)="setTab('optimizedCV')"
    >
      Optimized CV
    </button>
    <button
      type="button"
      [class.is-active]="activeTab === 'coverLetter'"
      (click)="setTab('coverLetter')"
    >
      Cover Letter
    </button>
  </div>

  <p *ngIf="atsScore !== null" class="tabs-card__score">ATS Match Score: <strong>{{ atsScore }}%</strong></p>
</section>

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # SPA fallback: any unknown route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + legacy capitalised paths + uploads + websockets to the gateway
    location /api/ {
        proxy_pass         http://api-gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /Event/ {
        proxy_pass         http://api-gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /Inscription/ {
        proxy_pass         http://api-gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /Feedback/ {
        proxy_pass         http://api-gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /User/ {
        proxy_pass         http://api-gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /uploads/ {
        proxy_pass         http://api-gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # WebSocket upgrade for /ws (chat / messaging)
    location /ws/ {
        proxy_pass         http://api-gateway:8088;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_read_timeout 86400s;
    }
}

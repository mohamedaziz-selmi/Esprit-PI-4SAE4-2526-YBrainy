spring.datasource.url=jdbc:h2:mem:breadandbutteruser;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
eureka.client.enabled=false
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=false
management.health.rabbit.enabled=false
app.rabbitmq.exchange=ybrainy.test.events
app.rabbitmq.user-xp-award-queue=ybrainy.test.user.xp-award.queue
app.rabbitmq.user-xp-award-routing-key=user.xp.award
app.rabbitmq.user-created-routing-key=user.created
app.rabbitmq.user-updated-routing-key=user.updated
app.rabbitmq.user-deleted-routing-key=user.deleted
app.rabbitmq.user-login-routing-key=user.login
app.rabbitmq.user-xp-awarded-routing-key=user.xp.awarded
app.rabbitmq.user-level-up-routing-key=user.level.up
app.mail.enabled=false
management.health.mail.enabled=false
spring.mail.host=localhost
spring.mail.port=2525
app.upload.images-dir=${java.io.tmpdir}/bb-user-test-images
keycloak.base-url=http://localhost:9190
keycloak.realm=microservices
keycloak.admin.client-id=bb-user-admin
keycloak.admin.client-secret=test-secret
keycloak.auth.client-id=angular-client

# =============================================================================
# YBrainy Platform – Central Configuration Reference
# File: user/p-r-k/config-repo/application.yml
#
# Structure (multi-document YAML separated by ---):
#   Document 1  : Shared defaults injected into every service
#   Document 2  : "gateway"   profile – full API Gateway route table
#   Documents 3+ : per-service profiles (spring.config.activate.on-profile)
#
# How each service uses this file
# --------------------------------
#   Spring services with spring-cloud-starter-config → fetched automatically
#   via YBRAINY/ConfigServer (port 8888, native, search-location set to this dir).
#   Services without config-client → their application.properties already contain
#   the values shown here; this file is the canonical reference.
#
# Environment variables (override defaults when set):
#   YBRAINY_EUREKA_URL   – Eureka server (default: http://localhost:8761/eureka/)
#   RABBITMQ_HOST        – RabbitMQ host  (default: localhost)
#   RABBITMQ_PORT        – RabbitMQ port  (default: 5672)
#   RABBITMQ_USERNAME    – default: guest
#   RABBITMQ_PASSWORD    – default: guest
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# DOCUMENT 1 – Shared defaults (applies to ALL services)
# ─────────────────────────────────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: ${YBRAINY_EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    org.springframework.cloud: INFO

---
# ─────────────────────────────────────────────────────────────────────────────
# DOCUMENT 2 – "gateway" profile
# Applied to: user/p-r-k/ApiGateway (spring.profiles.active=gateway)
# ─────────────────────────────────────────────────────────────────────────────
server:
  port: 8088

spring:
  config:
    activate:
      on-profile: gateway
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # ── User / Auth ──────────────────────────────────────────────────────
        - id: user-auth
          uri: lb://breadandbutteruser
          predicates: [ Path=/api/auth/** ]
          order: 1
        - id: user-users
          uri: lb://breadandbutteruser
          predicates: [ Path=/api/users/** ]
          order: 2
        - id: user-tracking
          uri: lb://breadandbutteruser
          predicates: [ Path=/api/tracking/** ]
          order: 3
        - id: user-warnings-profile
          uri: lb://breadandbutteruser
          predicates: [ Path=/api/warnings/** ]
          order: 4
        - id: user-ban-appeals-profile
          uri: lb://breadandbutteruser
          predicates: [ Path=/api/ban-appeals, Path=/api/ban-appeals/** ]
          order: 5

        # ── Courses ──────────────────────────────────────────────────────────
        - id: course-service
          uri: lb://course-service
          predicates: [ Path=/api/courses/** ]
          order: 10
        - id: course-learning-paths
          uri: lb://course-service
          predicates: [ Path=/api/learning-paths/** ]
          order: 11
        - id: course-instructor
          uri: lb://course-service
          predicates: [ Path=/api/instructor/** ]
          order: 12
        - id: course-students
          uri: lb://course-service
          predicates: [ Path=/api/students/** ]
          order: 13
        - id: course-ml
          uri: lb://course-service
          predicates: [ Path=/api/ml/** ]
          order: 14
        - id: course-certificates
          uri: lb://course-service
          predicates: [ Path=/api/certificates/** ]
          order: 15
        - id: quiz-service
          uri: lb://quiz-service
          predicates: [ Path=/api/quizzes/** ]
          order: 16
        - id: enrollment-service
          uri: lb://enrollment-service
          predicates: [ Path=/api/enrollments/** ]
          order: 17
        - id: lesson-service
          uri: lb://lesson-service
          predicates: [ Path=/api/lessons/** ]
          order: 18

        # ── Payment ──────────────────────────────────────────────────────────
        - id: payment-service-payments
          uri: lb://payment-service
          predicates: [ Path=/api/payments/** ]
          order: 20
        - id: payment-service-packs
          uri: lb://payment-service
          predicates: [ Path=/api/packs/** ]
          order: 21
        - id: payment-service-internal
          uri: lb://payment-service
          predicates: [ Path=/api/internal/payments/** ]
          order: 22
        - id: cart-service
          uri: lb://cart-service
          predicates: [ Path=/api/cart/** ]
          order: 23
        - id: finance-service
          uri: lb://finance-service
          predicates: [ Path=/api/finance/** ]
          order: 24

        # ── Forum ────────────────────────────────────────────────────────────
        - id: forum-category-service
          uri: lb://category-service
          predicates: [ Path=/api/categories/** ]
          order: 30
        - id: forum-thread-service
          uri: lb://thread-service
          predicates: [ Path=/api/threads/**, Path=/api/wishlist/**, Path=/api/ai/**, Path=/uploads/threads/** ]
          order: 31
        - id: forum-post-service
          uri: lb://post-service
          predicates: [ Path=/api/posts/**, Path=/uploads/posts/** ]
          order: 32
        - id: forum-comment-service
          uri: lb://comment-service
          predicates: [ Path=/api/comments/** ]
          order: 33
        - id: forum-messaging-service
          uri: lb://messaging-service
          predicates: [ Path=/api/messages/**, Path=/uploads/messages/**, Path=/ws/** ]
          order: 34
        - id: forum-users
          uri: lb://breadandbutteruser
          predicates: [ Path=/api/forum-users/** ]
          order: 35
        - id: forum-dashboard-service
          uri: lb://breadandbutteruser
          predicates: [ Path=/api/dashboard/** ]
          order: 36
        - id: forum-notification-service
          uri: lb://breadandbutteruser
          predicates: [ Path=/api/notifications/** ]
          order: 37
        # predict-service is Python/Flask – no Eureka; routed by direct URL
        - id: forum-predict-service
          uri: http://localhost:${PREDICT_SERVICE_PORT:5001}
          predicates: [ Path=/api/predict/** ]
          order: 36

        # ── Personality / Warnings ────────────────────────────────────────────
        - id: personality-behavior-personalities
          uri: lb://personality-behavior-service
          predicates: [ Path=/api/personalities, Path=/api/personalities/** ]
          order: 40
        - id: personality-behavior-behaviors
          uri: lb://personality-behavior-service
          predicates: [ Path=/api/behaviors, Path=/api/behaviors/** ]
          order: 41
        - id: warning-ban-appeal-service
          uri: lb://warning-ban-appeal-service
          predicates: [ Path=/api/appeals/**, Path=/api/bans/** ]
          order: 42

        # ── Partnership / Jobs ───────────────────────────────────────────────
        - id: partnership-service
          uri: lb://partnership-service
          predicates: [ Path=/api/partnerships/** ]
          order: 50
        - id: job-offer-service
          uri: lb://job-offer-service
          predicates: [ Path=/api/offers/**, Path=/api/applications/**, Path=/api/generate-application, Path=/api/generate-application/** ]
          order: 51

        # ── Events ──────────────────────────────────────────────────────────
        - id: event-service-legacy
          uri: lb://event-service
          predicates: [ Path=/Event/** ]
          order: 60
        - id: event-service-api
          uri: lb://event-service
          predicates: [ Path=/api/events/**, Path=/api/recommendations/** ]
          order: 61
        - id: inscription-service-legacy
          uri: lb://inscription-service
          predicates: [ Path=/Inscription/** ]
          order: 62
        - id: inscription-service-api
          uri: lb://inscription-service
          predicates: [ Path=/api/inscriptions/** ]
          order: 63
        - id: feedback-service-legacy
          uri: lb://feedback-service
          predicates: [ Path=/Feedback/** ]
          order: 64
        - id: feedback-service-api
          uri: lb://feedback-service
          predicates: [ Path=/api/feedbacks/** ]
          order: 65
        - id: events-user-service-legacy
          uri: lb://events-user-service
          predicates: [ Path=/User/** ]
          order: 66
        - id: events-user-service-api
          uri: lb://events-user-service
          predicates: [ Path=/api/event-users/** ]
          order: 67


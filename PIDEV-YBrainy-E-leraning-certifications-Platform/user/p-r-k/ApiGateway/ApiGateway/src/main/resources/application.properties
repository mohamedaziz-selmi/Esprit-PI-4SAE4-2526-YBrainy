# ── Courses ───────────────────────────────────────────────────────────────────
# Progress/complete/time actions on lessons belong to course-service (EnrollmentController).
# Must be order 7 — before file-serving (8), lessons-bridge (9), and course catch-all (10).
spring.cloud.gateway.routes[53].id=course-lesson-actions
spring.cloud.gateway.routes[53].uri=lb://course-service
spring.cloud.gateway.routes[53].predicates[0]=Path=/api/courses/*/lessons/*/complete,/api/courses/*/lessons/*/time,/api/courses/*/progress
spring.cloud.gateway.routes[53].order=7

# File serving for lesson content (PDFs, videos, images) lives in lesson-service.
# Must be order 8 — before lessons-bridge (9) and course-service catch-all (10).
spring.cloud.gateway.routes[52].id=lesson-service-files
spring.cloud.gateway.routes[52].uri=lb://lesson-service
spring.cloud.gateway.routes[52].predicates[0]=Path=/api/courses/files/**
spring.cloud.gateway.routes[52].order=8

# Course-scoped lesson endpoints live in lesson-service (LessonFileController
# is mapped at /api/courses/{courseId}/lessons). Match this BEFORE the broader
# /api/courses/** route to lesson-service, otherwise course-service receives

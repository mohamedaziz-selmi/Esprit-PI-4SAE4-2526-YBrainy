spring.application.name=api-gateway
server.port=8088

# ── Eureka ────────────────────────────────────────────────────────────────────
# Set YBRAINY_EUREKA_URL to override; default matches Eureka server port 8761.
eureka.client.service-url.defaultZone=${YBRAINY_EUREKA_URL:http://localhost:8761/eureka/}

# ── Service discovery locator (auto-routes by service-id, fallback) ───────────
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ── Codec (large file uploads) ────────────────────────────────────────────────
spring.codec.max-in-memory-size=50MB

# ── Security (Keycloak / JWT) ─────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:9190/realms/microservices}
keycloak.auth.client-id=${KEYCLOAK_AUTH_CLIENT_ID:angular-client}

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  GATEWAY ROUTES                                                           ║
# ║  All URIs use lb:// so Spring Cloud LoadBalancer resolves via Eureka.     ║
# ║  Exception: forum/predict-service (Python/Flask) uses direct http URL.   ║
# ╚═══════════════════════════════════════════════════════════════════════════╝


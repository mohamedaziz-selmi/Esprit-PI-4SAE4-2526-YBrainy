spring.application.name=finance-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=8995

spring.datasource.url=jdbc:mysql://localhost:3306/elearning_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.web=DEBUG


spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.rabbitmq.exchange=${APP_RABBITMQ_EXCHANGE:ybrainy.events}
app.rabbitmq.payment-completed-routing-key=${APP_RABBITMQ_PAYMENT_COMPLETED_ROUTING_KEY:payment.completed}
app.rabbitmq.finance-payment-queue=${APP_RABBITMQ_FINANCE_PAYMENT_QUEUE:finance.payment.completed.queue}
# Eureka Client Config
eureka.client.service-url.defaultZone=${YBRAINY_EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


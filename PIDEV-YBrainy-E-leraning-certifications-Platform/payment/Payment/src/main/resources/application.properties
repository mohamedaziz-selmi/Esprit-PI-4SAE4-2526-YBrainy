spring.application.name=payment-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=8095


spring.datasource.url=jdbc:mysql://localhost:3306/elearning_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.web=DEBUG


spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.rabbitmq.exchange=${APP_RABBITMQ_EXCHANGE:ybrainy.events}
app.rabbitmq.payment-completed-routing-key=${APP_RABBITMQ_PAYMENT_COMPLETED_ROUTING_KEY:payment.completed}
app.rabbitmq.finance-payment-queue=${APP_RABBITMQ_FINANCE_PAYMENT_QUEUE:finance.payment.completed.queue}
# File upload config
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
file.upload-dir=uploads

# Eureka Client Config
eureka.client.service-url.defaultZone=${YBRAINY_EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Text-to-speech API (RapidAPI)
tts.api.url=https://text-to-speach-api.p.rapidapi.com/text-to-speech
tts.api.key=${TTS_API_KEY:}

# Stripe checkout
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.currency=usd
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:4200/packs?payment=success&session_id={CHECKOUT_SESSION_ID}}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:4200/packs?payment=cancelled}

# SMTP mail (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${auth.static-user.email}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.checkout.courses-url=${APP_CHECKOUT_COURSES_URL:http://localhost:4200/courses}


# Static JWT auth user
auth.jwt.secret=${AUTH_JWT_SECRET}
auth.jwt.expiration-ms=86400000
auth.static-user.email=${AUTH_STATIC_USER_EMAIL}
auth.static-user.password=${AUTH_STATIC_USER_PASSWORD}
auth.static-user.name=${AUTH_STATIC_USER_NAME:YBrainy Admin}
auth.static-user.role=${AUTH_STATIC_USER_ROLE:ADMIN}

# AI content writer (RapidAPI)
content.writer.api-url=https://ai-content-writer.p.rapidapi.com/data
content.writer.api-key=${CONTENT_WRITER_API_KEY:}
content.writer.api-host=ai-content-writer.p.rapidapi.com

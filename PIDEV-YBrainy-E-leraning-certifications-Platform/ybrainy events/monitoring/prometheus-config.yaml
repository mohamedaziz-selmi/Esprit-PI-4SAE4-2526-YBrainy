apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'thread-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['thread-service.ybrainy.svc.cluster.local:8181']

      - job_name: 'post-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['post-service.ybrainy.svc.cluster.local:8182']

      - job_name: 'comment-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['comment-service.ybrainy.svc.cluster.local:8183']

      - job_name: 'category-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['category-service.ybrainy.svc.cluster.local:8180']

      - job_name: 'messaging-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['messaging-service.ybrainy.svc.cluster.local:8184']

      - job_name: 'event-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['event-service.ybrainy.svc.cluster.local:9001']

      - job_name: 'inscription-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['inscription-service.ybrainy.svc.cluster.local:9002']

      - job_name: 'feedback-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['feedback-service.ybrainy.svc.cluster.local:9004']

      - job_name: 'jenkins'
        metrics_path: /prometheus
        static_configs:
          - targets: ['host.docker.internal:8080']

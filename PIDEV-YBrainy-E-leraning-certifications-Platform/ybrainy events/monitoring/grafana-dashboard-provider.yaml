apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  events-dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'ybrainy-events'
        orgId: 1
        folder: 'YBrainy Events'
        folderUid: 'ybrainy-events'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/events

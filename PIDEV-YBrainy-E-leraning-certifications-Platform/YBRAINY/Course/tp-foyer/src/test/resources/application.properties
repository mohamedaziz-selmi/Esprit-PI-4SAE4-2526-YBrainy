# ── Datasource: H2 in-memory (replaces MySQL for CI) ──────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── App ────────────────────────────────────────────────────────────────────────
server.port=8082
spring.application.name=course-service
app.file.upload-dir=/tmp/test-uploads
app.frontend.url=http://localhost:4200

# ── Security ──────────────────────────────────────────────────────────────────
jwt.secret=test-jwt-secret-key-for-ci

# ── External APIs (dummy values, never called in unit tests) ──────────────────
ai.talking-head.base-url=http://localhost:8765
openrouter.api.key=test-openrouter-key
stripe.secret.key=test-stripe-secret
stripe.publishable.key=test-stripe-pub
stripe.webhook.secret=
ml.service.url=http://localhost:5000

# ── Messaging ─────────────────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ── Disable infrastructure services not available in CI ───────────────────────
eureka.client.enabled=false
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:

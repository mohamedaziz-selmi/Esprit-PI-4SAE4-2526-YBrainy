# ======================================================================
# cart-service — Service-specific config
# ======================================================================
spring.application.name=cart-service
server.port=${CART_SERVICE_PORT:8954}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/elearning_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

# RabbitMQ routing
app.rabbitmq.payment-completed-routing-key=${APP_RABBITMQ_PAYMENT_COMPLETED_ROUTING_KEY:payment.completed}
app.rabbitmq.finance-payment-queue=${APP_RABBITMQ_FINANCE_PAYMENT_QUEUE:finance.payment.completed.queue}

# SMTP (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${AUTH_STATIC_USER_EMAIL:culeks.here@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.checkout.courses-url=${APP_CHECKOUT_COURSES_URL:http://localhost:4200/courses}

# Static JWT auth
auth.jwt.secret=${AUTH_JWT_SECRET}
auth.jwt.expiration-ms=86400000
auth.static-user.email=${AUTH_STATIC_USER_EMAIL:culeks.here@gmail.com}

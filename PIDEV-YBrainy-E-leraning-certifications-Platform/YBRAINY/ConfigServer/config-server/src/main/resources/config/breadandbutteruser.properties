# ======================================================================
# breadandbutteruser (user-service) — Service-specific config
# ======================================================================
spring.application.name=breadandbutteruser
server.port=${USER_SERVICE_PORT:8899}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ybrainy_users?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Keycloak / OAuth2
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:9190/realms/microservices}
keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:9190}
keycloak.realm=microservices
keycloak.admin.client-id=bb-user-admin
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:master}
keycloak.admin.fallback-client-id=${KEYCLOAK_ADMIN_FALLBACK_CLIENT_ID:admin-cli}
keycloak.auth.client-id=${KEYCLOAK_AUTH_CLIENT_ID:angular-client}
keycloak.auth.client-secret=${KEYCLOAK_AUTH_CLIENT_SECRET:}

# SMTP (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${APP_SMTP_USERNAME:ybrainycontact@gmail.com}
spring.mail.password=${APP_SMTP_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App mail settings
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from-address=${APP_MAIL_FROM_ADDRESS:ybrainycontact@gmail.com}
app.mail.from-name=${APP_MAIL_FROM_NAME:ybrainy}
app.mail.app-name=${APP_MAIL_APP_NAME:ybrainy}
app.mail.logo-classpath=${APP_MAIL_LOGO_CLASSPATH:mail/assets/logo-white.png}
app.mail.forgot-password.subject=${APP_MAIL_FORGOT_PASSWORD_SUBJECT:Your ybrainy verification code}
app.mail.forgot-password.code-length=${APP_MAIL_FORGOT_PASSWORD_CODE_LENGTH:6}
app.mail.forgot-password.code-ttl-minutes=${APP_MAIL_FORGOT_PASSWORD_CODE_TTL_MINUTES:10}
app.mail.dev-fallback-on-failure=${APP_MAIL_DEV_FALLBACK_ON_FAILURE:true}
app.mail.dev-expose-fallback-code=${APP_MAIL_DEV_EXPOSE_FALLBACK_CODE:true}
management.health.mail.enabled=false

# RabbitMQ routing keys
spring.rabbitmq.listener.simple.auto-startup=${YBRAINY_RABBIT_LISTENER_ENABLED:true}
app.rabbitmq.user-xp-award-queue=${YBRAINY_USER_XP_AWARD_QUEUE:ybrainy.user.xp-award.queue}
app.rabbitmq.user-xp-award-routing-key=${YBRAINY_USER_XP_AWARD_ROUTING_KEY:user.xp.award}
app.rabbitmq.user-created-routing-key=${YBRAINY_USER_CREATED_ROUTING_KEY:user.created}
app.rabbitmq.user-updated-routing-key=${YBRAINY_USER_UPDATED_ROUTING_KEY:user.updated}
app.rabbitmq.user-deleted-routing-key=${YBRAINY_USER_DELETED_ROUTING_KEY:user.deleted}
app.rabbitmq.user-login-routing-key=${YBRAINY_USER_LOGIN_ROUTING_KEY:user.login}
app.rabbitmq.user-xp-awarded-routing-key=${YBRAINY_USER_XP_AWARDED_ROUTING_KEY:user.xp.awarded}
app.rabbitmq.user-level-up-routing-key=${YBRAINY_USER_LEVEL_UP_ROUTING_KEY:user.level.up}

# Avatar uploads
app.upload.images-dir=${APP_UPLOAD_IMAGES_DIR:/app/uploads/images}
app.upload.images-public-base-url=${APP_UPLOAD_IMAGES_PUBLIC_BASE_URL:http://localhost/images}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Face biometric
app.face-biometric.python-command=${APP_FACE_BIOMETRIC_PYTHON_COMMAND:py}
app.face-biometric.script-path=${APP_FACE_BIOMETRIC_SCRIPT_PATH:scripts/face_biometric.py}
app.face-biometric.cascade-path=${APP_FACE_BIOMETRIC_CASCADE_PATH:src/main/resources/biometrics/haarcascade_frontalface_alt.xml}
app.face-biometric.storage-dir=${APP_FACE_BIOMETRIC_STORAGE_DIR:tmp/face-biometric}

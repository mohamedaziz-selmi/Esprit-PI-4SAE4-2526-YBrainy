# ======================================================================
# lesson-service — Service-specific config
# ======================================================================
spring.application.name=lesson-service
server.port=${LESSON_SERVICE_PORT:8084}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ybrainy_lessons?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

# Override multipart for large lesson video uploads
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
app.file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads}

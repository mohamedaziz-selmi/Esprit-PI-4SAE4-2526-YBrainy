# ======================================================================
# warning-ban-appeal-service — Service-specific config
# Uses MongoDB, not MySQL.
# ======================================================================
spring.application.name=warning-ban-appeal-service
server.port=${WARNING_BAN_APPEAL_SERVICE_PORT:8086}

# MongoDB (no MySQL datasource for this service)
spring.data.mongodb.uri=${WARNING_BAN_APPEAL_MONGODB_URI:mongodb://localhost:27017/warning_ban_appeal_db}
spring.data.mongodb.auto-index-creation=true

# Downstream service names
services.user.name=${USER_SERVICE_NAME:breadandbutteruser}
services.user.url=${USER_SERVICE_URL:http://localhost:8899}

# RabbitMQ routing
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_LISTENER_AUTO_STARTUP:true}
app.rabbitmq.dead-letter-exchange=${RABBITMQ_DEAD_LETTER_EXCHANGE:ybrainy.events.dlx}
app.rabbitmq.warning-events-queue=${RABBITMQ_WARNING_EVENTS_QUEUE:warning.events}
app.rabbitmq.warning-events-routing-key-pattern=${RABBITMQ_WARNING_EVENTS_ROUTING_KEY_PATTERN:warning.#}
app.rabbitmq.appeal-events-routing-key-pattern=${RABBITMQ_APPEAL_EVENTS_ROUTING_KEY_PATTERN:ban-appeal.#}
app.rabbitmq.warning-events-dead-letter-queue=${RABBITMQ_WARNING_EVENTS_DLQ:warning.events.dlq}
app.rabbitmq.warning-events-dead-letter-routing-key=${RABBITMQ_WARNING_EVENTS_DLK:warning.dead}
app.rabbitmq.user-deleted-queue=${RABBITMQ_USER_DELETED_QUEUE:warning-ban-appeal.user.deleted}
app.rabbitmq.user-deleted-routing-key=${RABBITMQ_USER_DELETED_ROUTING_KEY:user.deleted}
app.rabbitmq.user-deleted-dead-letter-queue=${RABBITMQ_USER_DELETED_DLQ:warning-ban-appeal.user.deleted.dlq}
app.rabbitmq.user-deleted-dead-letter-routing-key=${RABBITMQ_USER_DELETED_DLK:user.deleted.dead}
app.rabbitmq.warning-created-routing-key=${RABBITMQ_WARNING_CREATED_ROUTING_KEY:warning.created}
app.rabbitmq.warning-updated-routing-key=${RABBITMQ_WARNING_UPDATED_ROUTING_KEY:warning.updated}
app.rabbitmq.warning-deleted-routing-key=${RABBITMQ_WARNING_DELETED_ROUTING_KEY:warning.deleted}
app.rabbitmq.appeal-created-routing-key=${RABBITMQ_APPEAL_CREATED_ROUTING_KEY:ban-appeal.created}
app.rabbitmq.appeal-updated-routing-key=${RABBITMQ_APPEAL_UPDATED_ROUTING_KEY:ban-appeal.updated}
app.rabbitmq.appeal-deleted-routing-key=${RABBITMQ_APPEAL_DELETED_ROUTING_KEY:ban-appeal.deleted}
app.rabbitmq.retry.max-attempts=${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
app.rabbitmq.retry.initial-interval-ms=${RABBITMQ_RETRY_INITIAL_INTERVAL_MS:1000}
app.rabbitmq.retry.multiplier=${RABBITMQ_RETRY_MULTIPLIER:2.0}
app.rabbitmq.retry.max-interval-ms=${RABBITMQ_RETRY_MAX_INTERVAL_MS:10000}

management.health.diskspace.enabled=false

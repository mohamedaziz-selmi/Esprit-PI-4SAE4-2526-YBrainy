# ======================================================================
# job-offer-service — Service-specific config
# ======================================================================
spring.application.name=job-offer-service
server.port=${JOB_OFFER_SERVICE_PORT:8187}

spring.datasource.url=${JOB_OFFER_DB_URL:jdbc:mysql://localhost:3306/jobofferdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${JOB_OFFER_DB_USERNAME:root}
spring.datasource.password=${JOB_OFFER_DB_PASSWORD:}

# SMTP (Gmail)
spring.mail.host=${JOB_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${JOB_MAIL_PORT:587}
spring.mail.username=${JOB_MAIL_USERNAME}
spring.mail.password=${JOB_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Notifications
app.notifications.from=${JOB_APPLICATION_NOTIFICATION_FROM}
app.notifications.accepted.enabled=${JOB_APPLICATION_ACCEPTED_NOTIFICATION_ENABLED:true}

# RabbitMQ routing
app.rabbitmq.partnership.queue=${APP_RABBITMQ_PARTNERSHIP_QUEUE:job-offer.partnership.events.queue}
app.rabbitmq.partnership.routing-key=${APP_RABBITMQ_PARTNERSHIP_ROUTING_KEY:partnership.event}
app.rabbitmq.application.queue=${APP_RABBITMQ_APPLICATION_QUEUE:job-application.events.queue}
app.rabbitmq.application.routing-key=${APP_RABBITMQ_APPLICATION_ROUTING_KEY:job-application.event}
app.rabbitmq.application.analytics-queue=${APP_RABBITMQ_APPLICATION_ANALYTICS_QUEUE:job-application.analytics.queue}

# Gemini AI
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.5-flash}
gemini.api.image-models=${GEMINI_API_IMAGE_MODELS:gemini-3.1-flash-image-preview,gemini-3-pro-image-preview,gemini-2.5-flash-image}

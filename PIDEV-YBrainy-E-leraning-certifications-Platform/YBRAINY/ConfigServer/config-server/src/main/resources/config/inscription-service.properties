# ======================================================================
# inscription-service (ybrainy events) — Service-specific config
# ======================================================================
spring.application.name=inscription-service
server.port=${INSCRIPTION_SERVICE_PORT:9002}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/inscription_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

# SMTP (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
ybrainy.mail.from=${SPRING_MAIL_FROM}
ybrainy.mail.logo-path=${YBRAINY_LOGO_PATH:user/angular/angular-app/src/assets/frontoffice/www.ciklum.com/wp-content/uploads/2025/10/logos.svg}

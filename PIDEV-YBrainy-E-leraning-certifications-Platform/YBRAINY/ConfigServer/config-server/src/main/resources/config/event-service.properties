# ======================================================================
# event-service (ybrainy events) — Service-specific config
# ======================================================================
spring.application.name=event-service
server.port=${EVENT_SERVICE_PORT:9001}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/event_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

# Groq AI (event description generation)
ybrainy.ai.groq.model=llama-3.3-70b-versatile
ybrainy.ai.groq.api-key=${EVENT_GROQ_API_KEY}

# HuggingFace image generation
ybrainy.ai.image.endpoint=https://router.huggingface.co/hf-inference/models/
ybrainy.ai.image.model=stabilityai/stable-diffusion-3-medium-diffusers
ybrainy.ai.image.hf-token=${HF_TOKEN}

# GitHub Models (embeddings for recommendation)
github.models.endpoint=https://models.github.ai/inference
github.models.api-key=${GITHUB_MODELS_API_KEY}
github.models.embedding.model=text-embedding-3-large

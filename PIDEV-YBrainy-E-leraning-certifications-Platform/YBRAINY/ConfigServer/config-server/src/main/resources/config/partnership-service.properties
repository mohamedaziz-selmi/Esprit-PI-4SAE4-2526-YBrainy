# ======================================================================
# partnership-service — Service-specific config
# ======================================================================
spring.application.name=partnership-service
server.port=${PARTNERSHIP_SERVICE_PORT:8081}

spring.datasource.url=${PARTNERSHIP_DB_URL:jdbc:mysql://localhost:3306/partnershipdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${PARTNERSHIP_DB_USERNAME:root}
spring.datasource.password=${PARTNERSHIP_DB_PASSWORD:}

# RabbitMQ routing
app.rabbitmq.partnership.queue=${APP_RABBITMQ_PARTNERSHIP_QUEUE:partnership.events.queue}
app.rabbitmq.partnership.routing-key=${APP_RABBITMQ_PARTNERSHIP_ROUTING_KEY:partnership.event}

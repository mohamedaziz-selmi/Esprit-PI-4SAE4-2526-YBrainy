# ======================================================================
# feedback-service (ybrainy events) — Service-specific config
# ======================================================================
spring.application.name=feedback-service
server.port=${FEEDBACK_SERVICE_PORT:9004}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/feedback_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

# HuggingFace (speech-to-text for audio feedback)
huggingface.api.model=openai/whisper-large-v3
huggingface.api.url=https://router.huggingface.co/hf-inference/models/${huggingface.api.model}
huggingface.api.token=${HF_TOKEN}

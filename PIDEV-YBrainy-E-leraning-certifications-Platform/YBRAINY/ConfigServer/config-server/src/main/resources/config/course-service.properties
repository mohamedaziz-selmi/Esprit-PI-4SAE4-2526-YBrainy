# ======================================================================
# course-service — Service-specific config
# ======================================================================
spring.application.name=course-service
server.port=${COURSE_SERVICE_PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ybrainy_courses?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

# Override multipart for large video uploads
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
app.file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads}

# JWT
jwt.secret=${JWT_SECRET}

# Stripe
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# OpenRouter AI
openrouter.api.key=${OPENROUTER_API_KEY}

# ML Microservice
ml.service.url=${ML_SERVICE_URL:http://localhost:5000}

# Frontend URL (for Stripe redirect)
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

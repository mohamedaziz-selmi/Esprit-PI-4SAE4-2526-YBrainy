# ======================================================================
# thread-service (forum) — Service-specific config
# ======================================================================
spring.application.name=thread-service
server.port=${THREAD_SERVICE_PORT:8181}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/forum_threads?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

# AI moderation (Groq)
ai.api-key=${GROQ_API_KEY}
ai.model=llama-3.1-8b-instant
ai.api-base-url=https://api.groq.com/openai/v1/chat/completions

# ML predict service
ml.predict.url=${ML_PREDICT_URL:http://predict-service:5001/predict}

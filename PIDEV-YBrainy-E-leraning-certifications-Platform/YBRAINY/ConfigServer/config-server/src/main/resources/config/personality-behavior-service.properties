# ======================================================================
# personality-behavior-service — Service-specific config
# Uses MongoDB, not MySQL.
# ======================================================================
spring.application.name=personality-behavior-service
server.port=${PERSONALITY_BEHAVIOR_SERVICE_PORT:8188}

# MongoDB (no MySQL datasource for this service)
spring.data.mongodb.uri=${PERSONALITY_BEHAVIOR_MONGODB_URI:mongodb://localhost:27017/personality_behavior_db}
spring.data.mongodb.auto-index-creation=true

# Downstream service names (Feign / Eureka lb://)
services.user.name=${USER_SERVICE_NAME:breadandbutteruser}
services.user.url=${USER_SERVICE_URL:http://localhost:8899}

# RabbitMQ routing
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_LISTENER_AUTO_STARTUP:true}
app.rabbitmq.dead-letter-exchange=${RABBITMQ_DEAD_LETTER_EXCHANGE:ybrainy.events.dlx}
app.rabbitmq.personality-events-queue=${RABBITMQ_PERSONALITY_EVENTS_QUEUE:personality.events}
app.rabbitmq.personality-events-routing-key-pattern=${RABBITMQ_PERSONALITY_EVENTS_ROUTING_KEY_PATTERN:personality.#}
app.rabbitmq.personality-events-dead-letter-queue=${RABBITMQ_PERSONALITY_EVENTS_DLQ:personality.events.dlq}
app.rabbitmq.personality-events-dead-letter-routing-key=${RABBITMQ_PERSONALITY_EVENTS_DLK:personality.dead}
app.rabbitmq.user-deleted-queue=${RABBITMQ_USER_DELETED_QUEUE:personality.user.deleted}
app.rabbitmq.user-deleted-routing-key=${RABBITMQ_USER_DELETED_ROUTING_KEY:user.deleted}
app.rabbitmq.user-deleted-dead-letter-queue=${RABBITMQ_USER_DELETED_DLQ:personality.user.deleted.dlq}
app.rabbitmq.user-deleted-dead-letter-routing-key=${RABBITMQ_USER_DELETED_DLK:user.deleted.dead}
app.rabbitmq.personality-created-routing-key=${RABBITMQ_PERSONALITY_CREATED_ROUTING_KEY:personality.created}
app.rabbitmq.personality-updated-routing-key=${RABBITMQ_PERSONALITY_UPDATED_ROUTING_KEY:personality.updated}
app.rabbitmq.behavior-created-routing-key=${RABBITMQ_BEHAVIOR_CREATED_ROUTING_KEY:personality.behavior.created}
app.rabbitmq.behavior-updated-routing-key=${RABBITMQ_BEHAVIOR_UPDATED_ROUTING_KEY:personality.behavior.updated}
app.rabbitmq.retry.max-attempts=${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
app.rabbitmq.retry.initial-interval-ms=${RABBITMQ_RETRY_INITIAL_INTERVAL_MS:1000}
app.rabbitmq.retry.multiplier=${RABBITMQ_RETRY_MULTIPLIER:2.0}
app.rabbitmq.retry.max-interval-ms=${RABBITMQ_RETRY_MAX_INTERVAL_MS:10000}

management.health.diskspace.enabled=false
